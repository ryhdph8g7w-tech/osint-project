name: Mise a jour quotidienne des donnees OSINT
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python build.py
      - run: |
          git config user.name "OSINT Bot"
          git config user.email "bot@osint-project"
          git add index.html
          if git diff --staged --quiet; then
            echo "Aucun changement detecte."
          else
            git commit -m "data: mise a jour $(date -u +%Y-%m-%d)"
            git push
          fi